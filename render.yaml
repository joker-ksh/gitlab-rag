services:
  - type: web
    name: gitlab-rag-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --only-binary=:all: pydantic pydantic-core; pip install -r ../requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
